name: Build v2 source tree

on:
  push:
    branches:
      - release-v2.0.0
    paths:
      - ".github/workflows/release-v2-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-v2.0.0
      - name: Rebuild source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .release_chunks/source_*.b64 | base64 -d > /tmp/StadiumAnnouncer-v2.0.0-source.zip
          unzip -oq /tmp/StadiumAnnouncer-v2.0.0-source.zip -d /tmp/stadium-v2
          cp -a /tmp/stadium-v2/. .
          rm -rf .release_chunks
          rm -f lib/Announcer.lua
          rm -f assets/announcer/voicepack.json
          rmdir assets/announcer 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Stadium Announcer v2.0.0 source tree"
          git push origin HEAD:release-v2.0.0
